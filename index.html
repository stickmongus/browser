<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY STUDIO HUB</title>
    <style>
        /* 기본 배경 및 폰트 설정 (다크 테마) */
        body {
            background-color: #202124;
            color: #ffffff;
            font-family: '맑은 고딕', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 메인 컨테이너 */
        .hub-container {
            background-color: #2B2D30;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* 프로필 이미지 */
        .profile-img {
            width: 100px;
            height: 100px;
            background-color: #3C3F44;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 닉네임 및 소개 */
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #8AB4F8;
        }
        
        p {
            font-size: 14px;
            color: #9AA0A6;
            margin: 0 0 30px 0;
            line-height: 1.5;
        }

        /* 링크 버튼 컨테이너 */
        .link-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 기본 링크 및 토글 버튼 공통 스타일 */
        .link-btn, .dropdown-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #3C3F44;
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s ease;
            position: relative;
            border: none;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }

        .link-btn:hover, .dropdown-toggle:hover {
            background-color: #4A4D53;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* 버튼별 고유 색상 포인트 */
        .btn-youtube:hover { 
            border-left: 5px solid #FF0000; 
        }

        .btn-discord:hover { 
            border-left: 5px solid #5865F2; 
        }

        .btn-github:hover { 
            border-left: 5px solid #FFFFFF; 
        }

        .btn-steam:hover { 
            border-left: 5px solid #66C0F4; 
        }

        .btn-browser:hover { 
            border-left: 5px solid #8AB4F8; 
        }

        /* 드롭다운 화살표 표시 */
        .arrow {
            position: absolute;
            right: 20px;
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .dropdown-toggle.active .arrow {
            transform: rotate(180deg);
        }

        /* 드롭다운으로 열릴 하위 메뉴 박스 */
        .submenu {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: -5px;
            padding: 12px;
            background-color: #232528;
            border-radius: 12px;
            border: 1px solid #3C3F44;
        }

        .submenu.open {
            display: flex;
        }

        /* 하위 링크 버튼 스타일 */
        .sub-link {
            background-color: #32353A;
            color: #D1D5DB;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .sub-link:hover {
            background-color: #3E4249;
            color: #FFFFFF;
            transform: translateX(4px);
        }

        .sub-link-forum:hover { 
            border-left: 4px solid #2EA043; 
        }

        .sub-link-repo:hover { 
            border-left: 4px solid #FFFFFF; 
        }

        /* ⭐ 새로 추가된 안내 상자 디자인 */
        .info-box {
            background-color: rgba(138, 180, 248, 0.1);
            border: 1px dashed #8AB4F8;
            color: #8AB4F8;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: left;
            margin-top: -5px;
            line-height: 1.5;
        }

        .info-box strong { 
            color: #ffffff; 
        }

        /* 하단 푸터 */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #5F6368;
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <!-- 프로필 아이콘 -->
        <div class="profile-img">🚀</div>
        
        <!-- 타이틀 및 설명 -->
        <h1>sometester</h1>
        <p>환영합니다!<br>제가 만든 프로그램과 커뮤니티 링크입니다.</p>

        <!-- 버튼들 -->
        <div class="link-group">
            <!-- 유튜브 버튼 -->
            <a href="https://www.youtube.com/@some_tester" target="_blank" class="link-btn btn-youtube">
                📺 유튜브 채널 구경하기
            </a>

            <!-- 디스코드 버튼 -->
            <a href="https://discord.gg/FcfzH4pfNx" target="_blank" class="link-btn btn-discord">
                💬 디스코드 커뮤니티 참여
            </a>

            <!-- 깃허브 토글 버튼 (클릭 시 하위 메뉴 노출) -->
            <div>
                <button type="button" class="dropdown-toggle btn-github" id="githubToggleBtn">
                    🐙 GitHub 구경하기
                    <span class="arrow">▼</span>
                </button>
                <div class="submenu" id="githubSubmenu">
                    <a href="https://github.com/stickmongus/browser" target="_blank" class="sub-link sub-link-repo">
                        📁 브라우저 소스코드 저장소
                    </a>
                    <a href="https://github.com/stickmongus/browser/discussions" target="_blank" class="sub-link sub-link-forum">
                        💬 브라우저 포럼 (질문/건의)
                    </a>
                </div>
            </div>

            <!-- 스팀 다운로드 버튼 -->
            <a href="https://drive.google.com/file/d/1aMvdqj_2gBOWmpdPTy77ZXrDq-smc1p6/view?usp=drive_link" target="_blank" class="link-btn btn-steam">
                🎮 스팀(Steam) 다운로드
            </a>

            <!-- 브라우저 다운로드 버튼 -->
            <a href="https://drive.google.com/file/d/1v4ImLEF05tEfo8-8AqCQRu6lE-ux-kxU/view?usp=drive_link" target="_blank" class="link-btn btn-browser">
                🌐 cBrowser 다운로드 (인터넷 뚫기)
            </a>
            
            <!-- ⭐ 사용자들을 위한 친절한 안내 문구 추가 -->
            <div class="info-box">
                💡 <strong>설치 팁:</strong> 실행 시 파란색 경고창(Windows PC 보호)이 뜬다면, 밑줄 친 <strong>[추가 정보]</strong>를 누른 후 <strong>[실행]</strong> 버튼을 클릭해 주세요!
            </div>
        </div>

        <!-- 하단 문구 -->
        <div class="footer">
            © 2026 sometester. All rights reserved.
        </div>
    </div>

    <!-- 드롭다운 클릭 이벤트 스크립트 -->
    <script>
        const toggleBtn = document.getElementById('githubToggleBtn');
        const submenu = document.getElementById('githubSubmenu');

        toggleBtn.addEventListener('click', () => {
            toggleBtn.classList.toggle('active');
            submenu.classList.toggle('open');
        });
    </script>

</body>
</html>
